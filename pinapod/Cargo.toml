[package]
name = "pinapod"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Zero-copy pod types with derive macros. Alignment-1 representations for zero-overhead data access."

[lints]
workspace = true

[features]
default = []
fixed = ["dep:fixed"]
kani = []
wincode = ["dep:wincode"]
solana-address = ["dep:solana-address"]
solana-program-error = ["dep:solana-program-error"]

[dependencies]
fixed = { workspace = true, optional = true }
pinapod-derive = { workspace = true }
solana-address = { version = ">= 2.2, <2.7", optional = true, features = ["copy"] }
solana-program-error = { version = ">=1.0, <4.0", optional = true }
wincode = { version = "0.5.5", default-features = false, features = ["derive"], optional = true }
