[package]
name = "pinapod"
version = "0.4.2"
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Zero-copy pod types with derive macros. Alignment-1 representations for zero-overhead data access."

[lints]
workspace = true

[features]
default = []
# Widens the commit-entry check from the layout walk back to the full semantic
# one. Off by default: layout is the complete precondition for a tail
# relocation, so the default already fails closed on a corrupt prefix or a
# short buffer, while the full walk costs one semantic pass per commit.
# Enabling this makes `commit` itself reject a buffer whose content is invalid
# even where the layout is sound. Only adds coverage.
compact-commit-full-validation = []
fixed = ["dep:fixed"]
floats = []
kani = []
wincode = ["dep:wincode"]
solana-address = ["dep:solana-address"]
solana-program-error = ["dep:solana-program-error"]

[dependencies]
# default-features stays off for optional dependencies: the runtime crate is
# documented as no_std, so a feature must not silently re-enable std-backed
# defaults on behalf of the dependent.
fixed = { workspace = true, optional = true, default-features = false }
pinapod-derive = { workspace = true }
solana-address = { optional = true, features = ["copy"], workspace = true, default-features = false }
solana-program-error = { default-features = false, optional = true, workspace = true }
wincode = { default-features = false, features = ["derive"], optional = true, workspace = true }

[dev-dependencies]
criterion = { workspace = true, default-features = true }
pinapod_previous = { package = "pinapod", version = "0.1.0", git = "https://github.com/pina-rs/pinapod.git", rev = "71ad8bee53e3e6939fe14760e539942d0f1bdd77" }
stats_alloc = { workspace = true, default-features = true }
trybuild = { workspace = true, default-features = true }
zeropod = { workspace = true, default-features = true }

[[bench]]
name = "api_comparison"
harness = false
