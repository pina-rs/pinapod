[workspace]
members = ["pinapod", "pinapod-derive"]
# The fuzz suite is a standalone workspace managed by cargo-fuzz.
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
homepage = "https://github.com/pina-rs/pinapod"
keywords = ["no-std", "pod", "serialization", "zero-copy"]
license = "Apache-2.0"
repository = "https://github.com/pina-rs/pinapod"
rust-version = "1.89.0"

[workspace.dependencies]
fixed = { version = "=1.30.0", default-features = false }
# Exact pin: generated code expands against the runtime crate's private
# contracts, so mixed versions are never compatible. Updated only by the
# MonoChange release flow.
pinapod-derive = { version = "=0.3.1", path = "pinapod-derive" }

[workspace.lints.rust]
# Group lints
rust_2021_compatibility = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }

# Individual lints. Unsafe is denied by default and explicitly allowed only
# around PinaPod's audited byte-casting implementation and adversarial tests.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unstable_features = "deny"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"
edition_2024_expr_fragment_specifier = "allow"

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
  'cfg(coverage)',
  'cfg(fuzzing)',
  'cfg(kani)',
  'cfg(target_os, values("solana"))',
  'cfg(target_feature, values("static-syscalls"))',
]

[workspace.lints.clippy]
# Group lints
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Individual lints shared with Pina.
blocks_in_conditions = "allow"
cargo_common_metadata = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
expl_impl_clone_on_copy = "allow"
items_after_statements = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
no_effect_underscore_binding = "allow"
tabs-in-doc-comments = "allow"
too_many_lines = "allow"
wildcard_dependencies = "deny"
wildcard_imports = "allow"
