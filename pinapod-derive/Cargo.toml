[package]
name = "pinapod-derive"
version = "0.4.2"
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Derive macros for pinapod"

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = { workspace = true, default-features = true }
proc-macro2 = { workspace = true, default-features = true }
quote = { workspace = true, default-features = true }
syn = { workspace = true, features = ["full", "extra-traits"], default-features = true }
