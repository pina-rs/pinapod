[graph]
all-features = true

[advisories]
# The advisory database is a git clone, so it lives outside every directory
# the CI caches save and restore: a clone stored under `target/` did not
# survive a rust-cache round trip, and cargo-deny then failed to load any
# advisories from the restored copy on the release branch. A repo-relative
# directory is freshly cloned on every runner, and the git CLI performs the
# clone and fetches — the same mechanism cargo-audit uses successfully in
# the adjacent security job — instead of the embedded git implementation.
db-path = ".advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db.git"]
git-fetch-with-cli = true
yanked = "deny"

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "Unicode-3.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/blueshift-gg/zeropod.git",
  "https://github.com/pina-rs/pinapod.git",
]
