[package]
name = "pinapod-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
# Pinned to an exact version: libfuzzer's 0.4.x line has changed sanitizer
# behavior between minor releases, and the committed corpus/crash triage is
# only meaningful against the engine the snapshots were taken with.
libfuzzer-sys = "=0.4.13"
pinapod = { path = "../pinapod", features = ["wincode"] }
# Direct dependency so wincode targets use the same crate instance that
# pinapod's feature graph selects. That means this version has to move in
# lockstep with the workspace's wincode pin: a mismatch resolves two copies of
# the crate, and the fuzz targets then fail to compile with
# `the trait bound PodBool: SchemaRead<'_, ...> is not satisfied` because
# pinapod's impls belong to the other copy.
wincode = { version = "0.6.1", default-features = false }

# The fuzz suite is its own workspace so the release workspace never builds
# fuzzing dependencies.
[workspace]

[[bin]]
name = "fixed_validate"
path = "fuzz_targets/fixed_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compact_validate"
path = "fuzz_targets/compact_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compact_patch"
path = "fuzz_targets/compact_patch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compact_enum_validate"
path = "fuzz_targets/compact_enum_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compact_enum_patch"
path = "fuzz_targets/compact_enum_patch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wincode_read"
path = "fuzz_targets/wincode_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pod_containers"
path = "fuzz_targets/pod_containers.rs"
test = false
doc = false
bench = false
