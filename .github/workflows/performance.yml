name: performance

# The instruction-count gate runs on every pull request, not only ones that
# touch source paths: Callgrind counts retired instructions, so a Linux
# runner reproduces the committed baseline exactly, the comparison cannot be
# flaky, and no timing discipline is required.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  instruction-gate:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Valgrind is Linux-only, so it ships in the perf profile rather than the
      # base shell; every step below runs inside that profile.
      - name: install iai-callgrind runner
        # The runner binary must match the library version pinned in
        # Cargo.lock; the library refuses a mismatched runner.
        run: cargo install iai-callgrind-runner --version 0.16.1 --locked
        shell: devenv --profile perf shell -c -- bash -e {0}
      - name: measure hot paths
        run: >
          cargo bench --manifest-path pinapod/Cargo.toml --bench iai_hot_paths --locked --
          --save-summary=json
        shell: devenv --profile perf shell -c -- bash -e {0}
      - name: compare with committed baseline
        run: deno run --allow-read --allow-write=pinapod/benches scripts/check-iai-baseline.ts
        shell: devenv --profile perf shell -c -- bash -e {0}
      - name: upload instruction summaries
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pinapod-instruction-summaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/iai
          if-no-files-found: error
          retention-days: 14
