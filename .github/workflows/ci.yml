name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: lint all
        run: lint:all
        shell: devenv shell -c -- bash -e {0}

  security:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: audit dependencies
        run: security:audit
        shell: devenv shell -c -- bash -e {0}

  cargo-deny:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: check dependency policy
        run: security:deny
        shell: devenv shell -c -- bash -e {0}

  zizmor:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: audit GitHub Actions
        run: security:zizmor
        shell: devenv shell -c -- bash -e {0}

  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: run tests
        run: test:all
        shell: devenv shell -c -- bash -e {0}

  test-stable:
    # Nightly is the development toolchain, so the pinned nightly job alone
    # can hide stable breakage. The UI snapshots are recorded on nightly and
    # are skipped here (PINAPOD_UI=skip).
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: install stable Rust
        run: rustup toolchain install stable --profile minimal
        shell: devenv shell -c -- bash -e {0}
      - name: run tests on stable
        run: PINAPOD_UI=skip cargo +stable test --workspace --all-features --locked
        shell: devenv shell -c -- bash -e {0}

  no-default-features:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: check without default features
        run: build:no-default
        shell: devenv shell -c -- bash -e {0}

  msrv:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: install minimum supported Rust
        run: rustup toolchain install 1.89.0 --profile minimal
        shell: devenv shell -c -- bash -e {0}
      - name: test on minimum supported Rust
        run: PINAPOD_UI=skip cargo +1.89.0 test --workspace --all-features --locked
        shell: devenv shell -c -- bash -e {0}

  i686:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install 32-bit linker support
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: install 32-bit Rust target
        run: rustup target add i686-unknown-linux-gnu
      - name: run fixed and compact regressions on 32-bit Rust
        run: >
          cargo test --manifest-path pinapod/Cargo.toml --all-features --locked
          --target i686-unknown-linux-gnu
          --test validation
          --test fixed_pina_pod
          --test compact_backend
          --test compact_commit_shift
        env:
          CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER: /usr/bin/gcc
          RUSTFLAGS: -C link-self-contained=no

  miri:
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: run Miri
        run: test:miri
        shell: devenv shell -c -- bash -e {0}

  kani:
    name: kani (${{ matrix.shard.name }})
    timeout-minutes: ${{ matrix.shard.timeout }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: bool
            harness: "bool::kani_proofs"
            timeout: 90
          - name: option
            harness: "option::kani_proofs"
            timeout: 90
          - name: string
            harness: "string::kani_proofs"
            timeout: 90
          - name: vec
            harness: "vec::kani_proofs"
            timeout: 90
          - name: u16
            harness: "u16_proofs"
            timeout: 90
          - name: u32
            harness: "u32_proofs"
            timeout: 90
          - name: u64
            harness: "u64_proofs"
            timeout: 90
          - name: u128
            harness: "u128_proofs"
            timeout: 90
          - name: i16
            harness: "i16_proofs"
            timeout: 90
          - name: i32
            harness: "i32_proofs"
            timeout: 90
          - name: i64
            harness: "i64_proofs"
            timeout: 90
          - name: i128
            harness: "i128_proofs"
            timeout: 120
          - name: generated compact accessor bounds
            harness: "generated_proofs::validated_accessors_are_bounded"
            timeout: 150
          - name: generated compact initialize
            harness: "generated_proofs::initialize_builds_a_valid_view"
            timeout: 150
          - name: generated compact update
            harness: "generated_proofs::update_preserves_roundtrip"
            timeout: 150
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install z3
        run: sudo apt-get install -y z3
      - name: verify Pinapod
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          command: cargo kani --manifest-path pinapod/Cargo.toml --features kani --output-format terse --harness "${{ matrix.shard.harness }}"

  release-preview:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: preview release
        if: hashFiles('.changeset/*.md') != ''
        run: monochange step prepare-release --dry-run --format json
        shell: devenv shell -c -- bash -e {0}
