name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example pinapod/v0.2.0
        required: true
        type: string
  push:
    tags: ["pinapod/v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    if: github.repository_owner == 'pina-rs' && startsWith(inputs.tag || github.ref_name, 'pinapod/v')
    environment: publisher
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: validate release tag
        run: |
          [[ "$RELEASE_TAG" == pinapod/v* ]] || { echo "::error::Unexpected release tag '$RELEASE_TAG'." >&2; exit 1; }
        shell: bash
      - name: checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: get crates.io OIDC token
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: crates-oidc
      - name: check publish readiness
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-oidc.outputs.token }}
        run: monochange step publish-readiness --from HEAD --output "$RUNNER_TEMP/publish-readiness.json" --format json
        shell: devenv shell -- bash -e {0}
      - name: publish packages with monochange
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-oidc.outputs.token }}
          PUBLISH_STREAM_OUTPUT: "true"
        run: monochange step publish-packages --log-level info --all --output "$RUNNER_TEMP/publish-result.json" --format json
        shell: devenv shell -- bash -e {0}
      - name: publish draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
