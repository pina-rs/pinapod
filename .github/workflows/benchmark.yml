name: benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - .github/actions/devenv/**
      - .github/workflows/benchmark.yml
      - Cargo.lock
      - Cargo.toml
      - devenv.lock
      - devenv.nix
      - rust-toolchain.toml
      - pinapod/Cargo.toml
      - pinapod/benches/**
      - pinapod/src/**
      - pinapod-derive/Cargo.toml
      - pinapod-derive/src/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-comparison:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: compare PinaPod APIs
        run: cargo bench --manifest-path pinapod/Cargo.toml --bench api_comparison --locked
        shell: devenv shell -c -- bash -e {0}
      - name: upload Criterion results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pinapod-api-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/criterion
          if-no-files-found: error
          retention-days: 14
