name: changeset-policy

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: changeset-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # The monochange actions run outside `devenv shell`, so expose the
      # devenv-pinned monochange binary to the rest of the job.
      - name: expose the devenv-pinned monochange
        run: devenv shell -c -- bash -e -c 'command -v monochange | xargs dirname' >> "$GITHUB_PATH"
        shell: bash
      - name: collect changed files
        id: changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          separator: ","
      # Fails the pull request when changed release-owned paths lack changeset
      # coverage and posts the remediation comment.
      - name: enforce changeset policy
        uses: monochange/actions/changeset-policy@1fe45f5214577e78f6339e233c05fd429b1adaf7 # v0.9.0
        with:
          setup-monochange: false
          github-token: ${{ github.token }}
          changed-paths: ${{ steps.changed.outputs.all_changed_files }}
          labels: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          comment-on-failure: true
      # Surfaces the semantic semver evidence for the pull request: public API,
      # dependency, and metadata changes with a proposed bump per package.
      # This is the repository's semver check in place of cargo-semver-checks.
      - name: classify semantic changes
        uses: monochange/actions/change-classification@1fe45f5214577e78f6339e233c05fd429b1adaf7 # v0.9.0
        with:
          setup-monochange: false
          github-token: ${{ github.token }}
          detection-level: semantic
          dependency-propagation: public
