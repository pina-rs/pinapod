name: install-cvc5
description: Install the cvc5 release the Kani arithmetic harnesses invoke
inputs:
  cvc5-version:
    description: cvc5 release version, without the "cvc5-" tag prefix
    required: false
    default: "1.3.4"

runs:
  using: composite
  steps:
    # Kani drives CBMC, which shells out to the solver binary rather than
    # linking it, so cvc5 has to be on PATH. The archive is pinned by SHA-256:
    # cvc5's release page publishes six Linux x86_64 archives per version and
    # only the `-static` build is a self-contained binary, so the asset name is
    # constructed explicitly instead of pattern-matched. This mirrors CBMC's
    # own install-cvc5 action.
    - name: install cvc5
      shell: bash
      env:
        CVC5_VERSION: ${{ inputs.cvc5-version }}
      run: |
        set -euo pipefail

        case "${CVC5_VERSION}-$(uname -m)" in
          1.3.4-x86_64)
            cvc5_asset="cvc5-Linux-x86_64-static"
            cvc5_sha256="dcdbfada0ce493ee98259c0816e0daafc561c223aadb3af298c2968e73ea39c6" ;;
          1.3.4-aarch64|1.3.4-arm64)
            cvc5_asset="cvc5-Linux-arm64-static"
            cvc5_sha256="2a4c108367f20b0c8990abd6b9535a5d62e08908d471d4671c00734e408f85bc" ;;
          *)
            echo "::error::install-cvc5 has no cvc5 ${CVC5_VERSION} digest for $(uname -s)-$(uname -m); add one to .github/actions/install-cvc5/action.yml"
            exit 1 ;;
        esac

        workdir="$(mktemp -d)"
        trap 'rm -rf "$workdir"' EXIT

        url="https://github.com/cvc5/cvc5/releases/download/cvc5-${CVC5_VERSION}/${cvc5_asset}.zip"
        curl --fail --silent --show-error --location --retry 3 \
          --output "$workdir/cvc5.zip" "$url"
        echo "${cvc5_sha256}  $workdir/cvc5.zip" | sha256sum --check --status -
        # `-j` flattens the archive's `bin/` directory into the destination.
        unzip -j -d /usr/local/bin "$workdir/cvc5.zip" "${cvc5_asset}/bin/cvc5"

        cvc5 --version | head -n 1
