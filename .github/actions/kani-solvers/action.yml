name: kani-solvers
description: Install the SMT solvers the Kani proof harnesses invoke
inputs:
  cvc5-version:
    description: cvc5 release version, without the "cvc5-" tag prefix
    required: false
    default: "1.3.4"
  z3-version:
    description: z3 release version, without the "z3-" tag prefix
    required: false
    default: "4.16.0"

runs:
  using: composite
  steps:
    # Kani drives CBMC, which shells out to the solver binaries rather than
    # linking them, so both have to be on PATH. The releases are pinned by
    # SHA-256 per platform: an unpinned download would let a compromised or
    # moved release asset change what the proofs actually ran against.
    #
    # cvc5 is the solver the arithmetic harnesses request. Its release page
    # carries several Linux archives per version and only the `-static` one is
    # a self-contained binary, so the asset name is constructed explicitly
    # instead of pattern-matched.
    - name: install solvers
      shell: bash
      env:
        CVC5_VERSION: ${{ inputs.cvc5-version }}
        Z3_VERSION: ${{ inputs.z3-version }}
      run: |
        set -euo pipefail

        case "${CVC5_VERSION}-$(uname -m)" in
          1.3.4-x86_64)
            cvc5_asset="cvc5-Linux-x86_64-static"
            cvc5_sha256="dcdbfada0ce493ee98259c0816e0daafc561c223aadb3af298c2968e73ea39c6" ;;
          1.3.4-aarch64|1.3.4-arm64)
            cvc5_asset="cvc5-Linux-arm64-static"
            cvc5_sha256="2a4c108367f20b0c8990abd6b9535a5d62e08908d471d4671c00734e408f85bc" ;;
          *)
            echo "::error::kani-solvers has no cvc5 ${CVC5_VERSION} digest for $(uname -s)-$(uname -m); add one to .github/actions/kani-solvers/action.yml"
            exit 1 ;;
        esac

        case "${Z3_VERSION}-$(uname -m)" in
          4.16.0-x86_64)
            z3_asset="z3-4.16.0-x64-glibc-2.39"
            z3_sha256="7288c49a5bd6dbafd7b0b0d1f65956b91672da24b08f09242919af159be3418e" ;;
          4.16.0-aarch64|4.16.0-arm64)
            z3_asset="z3-4.16.0-arm64-glibc-2.38"
            z3_sha256="87fcd963d3eecb0f12cf1c3ef0ad74e84a3a7bd3caed5d94445645ef94ae6274" ;;
          *)
            echo "::error::kani-solvers has no z3 ${Z3_VERSION} digest for $(uname -s)-$(uname -m); add one to .github/actions/kani-solvers/action.yml"
            exit 1 ;;
        esac

        workdir="$(mktemp -d)"
        trap 'rm -rf "$workdir"' EXIT

        cvc5_url="https://github.com/cvc5/cvc5/releases/download/cvc5-${CVC5_VERSION}/${cvc5_asset}.zip"
        curl --fail --silent --show-error --location --retry 3 \
          --output "$workdir/cvc5.zip" "$cvc5_url"
        echo "${cvc5_sha256}  $workdir/cvc5.zip" | sha256sum --check --status -
        # `-j` flattens the archive's `bin/` directory into the destination.
        unzip -j -d /usr/local/bin "$workdir/cvc5.zip" "${cvc5_asset}/bin/cvc5"

        z3_url="https://github.com/Z3Prover/z3/releases/download/z3-${Z3_VERSION}/${z3_asset}.zip"
        curl --fail --silent --show-error --location --retry 3 \
          --output "$workdir/z3.zip" "$z3_url"
        echo "${z3_sha256}  $workdir/z3.zip" | sha256sum --check --status -
        unzip -j -d /usr/local/bin "$workdir/z3.zip" "${z3_asset}/bin/z3"

        cvc5 --version | head -n 1
        z3 --version
