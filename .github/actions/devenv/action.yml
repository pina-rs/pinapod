name: devenv
description: Set up Pinapod's reproducible development environment
inputs:
  github-token:
    description: GitHub token used while Nix fetches pinned inputs
    required: true
  cache-version:
    description: Cache-key version
    required: false
    default: "v1"
  setup-retries:
    description: Number of retries for transient Nix setup failures
    required: false
    default: "3"

runs:
  using: composite
  steps:
    - name: cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        prefix-key: "${{ inputs.cache-version }}-${{ hashFiles('devenv.nix', 'devenv.yaml', 'devenv.lock', 'rust-toolchain.toml', '.github/actions/devenv/action.yml') }}"

    - name: install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        github_access_token: ${{ inputs.github-token }}
        extra_nix_config: |
          accept-flake-config = true
          extra-substituters = https://devenv.cachix.org
          extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=

    - name: install devenv
      env:
        SETUP_RETRIES: ${{ inputs.setup-retries }}
      run: |
        retry() {
          local attempts="$1"
          shift

          if [[ ! "$attempts" =~ ^[1-9][0-9]*$ ]]; then
            echo "setup-retries must be a positive integer." >&2
            return 2
          fi

          local attempt=1
          local delay=5
          while true; do
            if "$@"; then
              return 0
            fi

            local exit_code=$?
            if [ "$attempt" -ge "$attempts" ]; then
              echo "Command failed after ${attempt} attempt(s): $*"
              return "$exit_code"
            fi

            echo "Command failed with exit code ${exit_code}: $*"
            echo "Retrying (${attempt}/${attempts}) in ${delay}s..."
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done
        }

        devenv_revision="$(
          nix eval --impure --raw --expr '
            let
              lock = builtins.fromJSON (builtins.readFile ./devenv.lock);
              revision = lock.nodes.devenv.locked.rev;
            in
              if builtins.match "^[0-9a-f]{40}$" revision != null then
                revision
              else
                throw "devenv.lock does not contain an immutable Devenv revision"
          '
        )"
        retry "$SETUP_RETRIES" nix profile add --accept-flake-config "github:cachix/devenv/${devenv_revision}#devenv"
      shell: bash
